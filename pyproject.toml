[project]
name = "procureguard-band-agents"
version = "0.1.0"
description = "Band-powered multi-agent enterprise vendor approval workflow for the Band of Agents hackathon."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
band = [
    "band-sdk[langgraph,crewai,pydantic-ai,anthropic]>=0.2.11",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
]
dev = [
    "pytest>=8.3.0",
]

[tool.uv]
package = false

